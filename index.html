<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Locally</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#070b12" />

  <!-- Supabase Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #070b12;
      --card: #0e1522;
      --line: #1b2535;
      --text: #f2f5fa;
      --muted: #8a97ab;
      --accent: #4fb3e8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    .hidden { display: none !important; }

    /* Header */
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 700; letter-spacing: .3px; }
    .logo { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-size: 20px;
      background: linear-gradient(135deg, #2b3a55, #4fb3e8); }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: #243249; display: grid; place-items: center;
      font-weight: 700; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* Search */
    .searchbar { display: flex; gap: 10px; padding: 4px 18px 14px; }
    .search { flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 50px;
      background: var(--card); border: 1px solid var(--line); border-radius: 25px; color: var(--muted); }
    .search input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 16px; }
    .filter-btn { width: 50px; height: 50px; border-radius: 25px; background: var(--card);
      border: 1px solid var(--line); display: grid; place-items: center; }
    .filter-panel { margin: 0 18px 14px; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
    .filter-panel label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
    .filter-panel input[type=range] { width: 100%; accent-color: var(--accent); }
    .filter-panel .row { display: flex; justify-content: space-between; margin-bottom: 14px; font-weight: 600; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { padding: 8px 14px; border-radius: 18px; border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #04121c; font-weight: 600; }

    /* List */
    main { padding: 0 18px 40px; }
    .item { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .thumb { width: 84px; height: 84px; border-radius: 18px; flex-shrink: 0; display: grid; place-items: center;
      font-size: 34px; background-size: cover; background-position: center; }
    .info { flex: 1; min-width: 0; }
    .info h3 { font-size: 18px; margin-bottom: 4px; }
    .info p { color: var(--muted); font-size: 15px; margin-bottom: 4px; }
    .status { font-size: 14px; color: var(--muted); }
    .status b { color: #6fdc8c; font-weight: 600; }
    .status b.taken { color: #f0a35e; }
    .chev { color: var(--accent); font-size: 26px; }
    .empty { text-align: center; color: var(--muted); padding: 50px 0; }

    /* Detail sheet */
    .sheet { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 20;
      padding-top: env(safe-area-inset-top); }
    .sheet .hero { height: 260px; display: grid; place-items: center; font-size: 80px; background-size: cover; background-position: center; }
    .sheet .body { padding: 20px 18px 40px; }
    .sheet h2 { font-size: 26px; margin-bottom: 6px; }
    .sheet .price { color: var(--accent); font-size: 22px; font-weight: 700; margin: 8px 0 14px; }
    .sheet .desc { color: var(--muted); line-height: 1.55; margin-bottom: 24px; }
    .back { position: absolute; top: calc(env(safe-area-inset-top) + 12px); left: 14px; width: 40px; height: 40px;
      border-radius: 50%; background: rgba(7,11,18,.7); display: grid; place-items: center; font-size: 22px; }
    .primary { width: 100%; height: 52px; border-radius: 26px; background: var(--accent); color: #04121c; font-weight: 700; font-size: 16px; }

    /* Auth screen */
    #auth { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column;
      justify-content: center; padding: 30px; text-align: center;
      background-image: radial-gradient(circle at 50% 0%, #15233a 0%, var(--bg) 60%); }
    #auth .logo { width: 84px; height: 84px; font-size: 42px; border-radius: 22px; margin: 0 auto 22px; }
    #auth h1 { font-size: 36px; margin-bottom: 8px; }
    #auth p { color: var(--muted); margin-bottom: 36px; }
    .google-btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; height: 54px;
      border-radius: 27px; background: #fff; color: #1f1f1f; font-weight: 600; font-size: 16px; }
    .guest { margin-top: 18px; color: var(--muted); font-size: 15px; text-decoration: underline; }
    .err { color: #ff8a8a; font-size: 14px; margin-top: 14px; min-height: 18px; }

    /* Account menu */
    .menu { position: fixed; top: calc(env(safe-area-inset-top) + 60px); right: 18px; z-index: 15; min-width: 210px;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
    .menu .who { padding: 10px 12px; font-size: 14px; color: var(--muted); border-bottom: 1px solid var(--line); margin-bottom: 4px; word-break: break-all; }
    .menu button { width: 100%; text-align: left; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>

  <!-- Sign-in screen -->
  <section id="auth">
    <div class="logo">🏠</div>
    <h1>Locally</h1>
    <p>
