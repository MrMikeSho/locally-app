<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Locally</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#02070c" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #02070c;
      --card: #060d14;
      --line: #1c2833;
      --field: #2a3642;
      --text: #e8edf2;
      --muted: #7f8c99;
      --accent: #4fb4de;
      --btn: #2190b8;
      --tile: #133847;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
    button, input, textarea { font: inherit; color: inherit; }
    button { background: none; border: none; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .hidden { display: none !important; }
    svg { display: block; }

    /* Header */
    #hdr { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between;
      padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; transition: background .25s; }
    #hdr.solid { background: rgba(2,7,12,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .hbrand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; opacity: 0; transition: opacity .25s; }
    #hdr.solid .hbrand { opacity: 1; }
    
    /* Header Small Logo */
    .hlogo { width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0;
      background: url('locally-logo.png') center/cover no-repeat, linear-gradient(135deg, #2b3a55, #4fb4de); }
    .hicons { display: flex; gap: 16px; }
    .hicons button { color: #fff; padding: 4px; }

    /* Top Hero Banner */
    .hero { height: 210px; position: relative;
      background: url('IMG_1147.webp') center/cover no-repeat, linear-gradient(160deg, #1e293b, #0b1522); }
    .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(2,7,12,.2), var(--bg)); }
    
    .intro { display: flex; gap: 14px; padding: 0 16px; margin-top: -42px; position: relative; z-index: 2; align-items: flex-start; }
    
    /* Main App Logo Badge */
    .biglogo { width: 80px; height: 80px; border: 2px solid var(--line); border-radius: 20px; flex-shrink: 0; overflow: hidden;
      background: url('locally-logo.png') center/cover no-repeat, linear-gradient(135deg, #4a4f7a, #9a90bf); }
    
    .intro h1 { font-size: 28px; font-weight: 700; line-height: 1.1; margin-top: 6px; }
    .intro p { margin-top: 6px; font-size: 14px; line-height: 1.45; color: #aab5c0; }
    .sub { padding: 18px 16px 0; font-size: 14px; line-height: 1.5; color: #7f8c99; }

    .navcards { padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px; }
    .navcard { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; width: 100%; text-align: left; }
    
    /* Card Thumbnail Icon Tiles */
    .tile { width: 50px; height: 50px; border-radius: 14px; background: var(--tile); display: grid; place-items: center; flex-shrink: 0; overflow: hidden;
      background-size: cover; background-position: center; }
    .tile.browse { background-image: url('IMG_1146.jpeg'); }
    .tile.list { background-image: url('IMG_1147.webp'); }

    .navcard .t { flex: 1; min-width: 0; }
    .navcard h3 { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
    .navcard p { font-size: 13px; color: #aab5c0; line-height: 1.3; }
    .navcard .chev { color: var(--accent); }

    h2.section { text-align: left; font-size: 20px; font-weight: 700; margin: 28px 16px 14px; }

    /* Search & list */
    .searchbar { display: flex; gap: 10px; padding: 0 16px 8px; }
    .search { flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 46px; background: var(--card);
      border: 1px solid var(--line); border-radius: 23px; color: var(--muted); }
    .search input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 15px; min-width: 0; }
    .filter-btn { width: 46px; height: 46px; border-radius: 23px; border: 1px solid var(--line); display: grid; place-items: center; color: #fff; background: var(--card); }
    .filter-panel { margin: 10px 16px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
    .filter-panel label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .filter-panel .row { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 600; font-size: 14px; }
    .filter-panel input[type=range] { width: 100%; accent-color: var(--accent); }

    .items { padding: 0 16px; }
    .item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .thumb { width: 68px; height: 68px; border-radius: 14px; flex-shrink: 0; background-size: cover; background-position: center; display: grid; place-items: center; font-size: 28px; }
    .item .info { flex: 1; min-width: 0; }
    .item h3 { font-size: 16px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
    .item p { font-size: 14px; color: #c9d2db; margin-bottom: 4px; }
    .empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: 14px; }

    /* Forms */
    .page { padding-top: calc(env(safe-area-inset-top) + 60px); }
    .page-title { padding: 6px 16px 12px; font-size: 24px; font-weight: 700; }
    .formcard { margin: 0 12px; padding: 16px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); }
    .fgroup { margin-top: 20px; }
    .fgroup > label.lbl { display: block; font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    .frow { display: flex; gap: 8px; }
    .frow > div { flex: 1; min-width: 0; }
    .fgroup input[type=text], .fgroup input[type=email], .fgroup input[type=tel], .fgroup input[type=number], .fgroup textarea {
      width: 100%; height: 46px; padding: 0 14px; background: var(--bg); border: 1px solid var(--field); border-radius: 12px; outline: none; font-size: 15px; }
    .fgroup textarea { height: 90px; padding-top: 10px; resize: vertical; }
    .fgroup input:focus, .fgroup textarea:focus { border-color: var(--accent); }
    .submit { width: 100%; height: 50px; margin-top: 28px; border-radius: 25px; background: var(--btn); color: #fff; font-size: 16px; font-weight: 600; }

    /* Login */
    .l-top { display: flex; align-items: center; justify-content: center; position: relative; padding: calc(env(safe-area-inset-top) + 14px) 16px 14px; border-bottom: 1px solid var(--line); background: var(--bg); }
    .l-top button { position: absolute; left: 16px; color: #fff; }
    .l-top span { font-size: 17px; font-weight: 600; }
    .login { padding: 30px 20px 0; }
    .login h1 { text-align: center; font-size: 24px; font-weight: 700; margin-bottom: 24px; }

    /* Menu */
    #menu { position: fixed; inset: 0; z-index: 90; background: var(--bg); overflow-y: auto; }
    .m-top { display: flex; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top) + 14px) 16px 14px; border-bottom: 1px solid var(--line); }
    .m-top .hbrand { opacity: 1; }
    .m-x { width: 40px; height: 40px; border-radius: 50%; background: var(--card); display: grid; place-items: center; color: #fff; }
    .m-list { padding: 20px 16px; }
    .m-list a, .m-list button { display: block; width: 100%; text-align: left; font-size: 18px; font-weight: 600; padding: 14px 0; border-bottom: 1px solid var(--line); }

    /* Detail */
    .d-hero { height: 220px; background-size: cover; background-position: center; position: relative; display: grid; place-items: center; font-size: 60px; background-color: var(--card); }
    .d-back { position: absolute; top: calc(env(safe-area-inset-top) + 12px); left: 12px; width: 38px; height: 38px; border-radius: 50%; background: rgba(2,7,12,.7); display: grid; place-items: center; color: #fff; }
    .d-body { padding: 18px 16px; }
    .d-body h2 { font-size: 22px; margin-bottom: 6px; }
    .d-body .price { color: var(--accent); font-size: 20px; font-weight: 700; margin: 8px 0 12px; }
    .d-body p { color: #aab5c0; line-height: 1.5; font-size: 15px; }

    /* Tab bar */
    #tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 60; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    #tabbar a { flex: 1; text-align: center; padding: 10px 4px 8px; font-size: 12px; color: var(--muted); position: relative; }
    #tabbar a svg { margin: 0 auto 4px; }
    #tabbar a.on { color: var(--accent); font-weight: 600; }
    #tabbar a.on::before { content: ""; position: absolute; top: -1px; left: 50%; transform: translateX(-50%); width: 40px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
  </style>
</head>
<body>

  <!-- Header -->
  <header id="hdr">
    <a class="hbrand" href="#/home"><span class="hlogo"></span><span>Locally</span></a>
    <div class="hicons">
      <button id="h-search" aria-label="Search"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
      <button id="h-menu" aria-label="Menu"><svg width="24" height
