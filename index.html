<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Locally</title>

  <!-- PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#070b12" />

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070b12;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    /* App Container: Offsets bottom by 55px to clip Jotform free banner */
    #app-container {
      width: 100%;
      height: calc(100% + 55px);
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }

    /* Embedded Jotform Frame keeping your exact original UI */
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Wrapped App Frame -->
  <div id="app-container">
    <iframe id="app-frame" src="https://app.jotform.com/261602592513554" title="Locally"></iframe>
  </div>

  <script>
    // 1. Supabase Initialization (Your credentials)
    const SUPABASE_URL = 'https://mzgpapxnusushsqezasr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16Z3BhcHhudXN1c2hzcWV6YXNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjkxMTAwMDB9';
    const REDIRECT_TO = 'https://mrmikesho.github.io/locally-app';

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Global Google Auth Trigger ("Continue to Locally")
    window.signInWithLocallyGoogle = async function() {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: REDIRECT_TO }
      });
      if (error) alert('Sign in error: ' + error.message);
    };

    // 3. Listen for incoming auth session
    sb.auth.onAuthStateChange((event, session) => {
      if (session) {
        console.log('Logged in to Locally as:', session.user.email);
      }
    });
  </script>

</body>
</html>
