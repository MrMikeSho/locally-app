<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Locally</title>
  
  <!-- PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8f9fa;
    }
    
    /* Header / Auth Bar */
    #auth-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background-color: #ffffff;
      border-bottom: 1px solid #e9ecef;
      height: 56px;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
    }
    .brand-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: #1a1a1a;
    }
    .auth-buttons {
      display: flex;
      gap: 8px;
    }
    .btn {
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    .btn-google {
      background-color: #4285f4;
      color: #ffffff;
    }
    .btn-facebook {
      background-color: #1877f2;
      color: #ffffff;
    }
    .btn-signout {
      background-color: #dc3545;
      color: #ffffff;
      display: none;
    }
    .user-label {
      font-size: 0.8rem;
      color: #495057;
      display: none;
    }

    /* App iFrame Container */
    #app-frame {
      width: 100%;
      height: calc(100% - 56px);
      border: none;
      position: absolute;
      top: 56px;
      left: 0;
    }
  </style>
</head>
<body>

  <!-- Top Navigation & Auth Bar -->
  <div id="auth-bar">
    <div class="brand-title">Locally</div>
    <div class="auth-buttons">
      <span id="user-label" class="user-label"></span>
      <button id="google-btn" class="btn btn-google">Google Sign In</button>
      <button id="fb-btn" class="btn btn-facebook">FB Sign In</button>
      <button id="signout-btn" class="btn btn-signout">Sign Out</button>
    </div>
  </div>

  <!-- Embedded Main App Frame -->
  <iframe id="app-frame" src="https://form.jotform.com/242883446851567" title="Locally App"></iframe>

  <script>
    // 1. Initialize Supabase Client
    const SUPABASE_URL = 'https://mzgpapxnusushsqezasr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16Z3BhcHhudXN1c2hzcWV6YXNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjkxMTAwMDB9'; // Automatically formatted for your project

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const REDIRECT_TO = 'https://mrmikesho.github.io/locally-app';

    // 2. Auth Handlers
    async function signInWithGoogle() {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: REDIRECT_TO }
      });
      if (error) alert('Error: ' + error.message);
    }

    async function signInWithFacebook() {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'facebook',
        options: { redirectTo: REDIRECT_TO }
      });
      if (error) alert('Error: ' + error.message);
    }

    async function signOut() {
      await supabase.auth.signOut();
      location.reload();
    }

    // Attach Listeners
    document.getElementById('google-btn').addEventListener('click', signInWithGoogle);
    document.getElementById('fb-btn').addEventListener('click', signInWithFacebook);
    document.getElementById('signout-btn').addEventListener('click', signOut);

    // 3. Session Listener
    async function checkUser() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session && session.user) {
        const name = session.user.user_metadata.full_name || session.user.email;
        document.getElementById('google-btn').style.display = 'none';
        document.getElementById('fb-btn').style.display = 'none';
        document.getElementById('user-label').innerText = `Hi, ${name.split(' ')[0]}`;
        document.getElementById('user-label').style.display = 'inline';
        document.getElementById('signout-btn').style.display = 'inline-block';
      }
    }

    checkUser();
  </script>
</body>
</html>
